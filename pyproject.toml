[project]
name = "wind-basel"
version = "0.1.0"
description = "Windvorhersage für Basel – CAS MLOps-Projektarbeit"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "requests>=2.32,<3",
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "hopsworks[python]==5.0.9",
]

[dependency-groups]
dev = ["ipykernel>=6.29,<7", "pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wind_basel"]
